name: Cleanup Failed Actions

on:
  workflow_dispatch:

  schedule:
    # Every hour at minute 17
    - cron: "17 * * * *"

permissions:
  actions: write
  contents: read

jobs:

  cleanup:

    runs-on: ubuntu-latest

    steps:

      # ======================================
      # CLEAN FAILED RUNS
      # ======================================
      - name: Cleanup Old Action Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

        shell: bash

        run: |
          set -e

          echo "======================================"
          echo "       MAGMA ACTION CLEANUP"
          echo "======================================"

          echo ""
          echo "Repository:"
          echo "$REPO"

          echo ""
          echo "Finding failed/cancelled runs..."

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '
              .workflow_runs[]
              | select(
                  (.status == "completed")
                  and
                  (
                    .conclusion == "failure"
                    or
                    .conclusion == "cancelled"
                    or
                    .conclusion == "timed_out"
                  )
                  and
                  .name != "Cleanup Failed Actions"
                )
              | [
                  .id,
                  .name,
                  .conclusion,
                  .created_at
                ]
              | @tsv
            ' > /tmp/runs.txt


          echo ""
          echo "======================================"
          echo "          RUNS FOUND"
          echo "======================================"


          if [ ! -s /tmp/runs.txt ]; then

            echo "✅ No failed/cancelled runs found."

            exit 0

          fi


          cat /tmp/runs.txt


          echo ""
          echo "======================================"
          echo "       DELETING OLD RUNS"
          echo "======================================"


          while IFS=$'\t' read -r RUN_ID NAME CONCLUSION CREATED; do

            if [ -z "$RUN_ID" ]; then
              continue
            fi

            echo ""
            echo "--------------------------------------"

            echo "Run ID:"
            echo "$RUN_ID"

            echo "Workflow:"
            echo "$NAME"

            echo "Conclusion:"
            echo "$CONCLUSION"

            echo "Created:"
            echo "$CREATED"


            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$RUN_ID"; then

              echo "✅ Deleted run $RUN_ID"

            else

              echo "⚠️ Could not delete run $RUN_ID"

            fi

          done < /tmp/runs.txt


          echo ""
          echo "======================================"
          echo "       CLEANUP COMPLETED"
          echo "======================================"