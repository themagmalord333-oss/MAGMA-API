name: Cleanup Failed Actions

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:

      - name: Cleanup Old Action Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "======================================"
          echo "       MAGMA ACTION CLEANUP"
          echo "======================================"

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '
              .workflow_runs[]
              | select(
                  .status == "completed"
                  and .conclusion != "success"
                  and .name != "Cleanup Failed Actions"
                )
              | [.id, .name, .conclusion, .created_at]
              | @tsv
            ' > /tmp/runs.txt

          echo ""
          echo "Runs found:"
          cat /tmp/runs.txt || true

          if [ ! -s /tmp/runs.txt ]; then
            echo ""
            echo "✅ No failed/cancelled runs found."
            exit 0
          fi

          while IFS=$'\t' read -r RUN_ID NAME CONCLUSION CREATED; do

            echo ""
            echo "--------------------------------------"
            echo "Deleting:"
            echo "ID:         $RUN_ID"
            echo "Workflow:   $NAME"
            echo "Conclusion: $CONCLUSION"
            echo "Created:    $CREATED"

            if gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$RUN_ID"; then

              echo "✅ Deleted $RUN_ID"

            else

              echo "⚠️ Could not delete $RUN_ID"

            fi

          done < /tmp/runs.txt

          echo ""
          echo "======================================"
          echo "       CLEANUP COMPLETED"
          echo "======================================"