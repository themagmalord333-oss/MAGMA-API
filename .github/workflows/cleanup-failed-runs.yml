name: Cleanup Failed Actions

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete Failed And Cancelled Runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "======================================"
          echo "     MAGMA ACTION CLEANUP"
          echo "======================================"

          gh api \
            --paginate \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/actions/runs?per_page=100" \
            --jq '
              .workflow_runs[]
              | select(
                  .name == "MAGMA Music API"
                  and .status == "completed"
                  and .conclusion != "success"
                )
              | [.id, .conclusion, .created_at]
              | @tsv
            ' > /tmp/runs.txt

          if [ ! -s /tmp/runs.txt ]; then
            echo "✅ No failed/cancelled MAGMA runs found."
            exit 0
          fi

          while IFS=$'\t' read -r RUN_ID CONCLUSION CREATED; do

            echo ""
            echo "Deleting run:"
            echo "ID:         $RUN_ID"
            echo "Conclusion: $CONCLUSION"
            echo "Created:    $CREATED"

            gh api \
              --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/actions/runs/$RUN_ID"

            echo "✅ Deleted: $RUN_ID"

          done < /tmp/runs.txt

          echo ""
          echo "======================================"
          echo "       CLEANUP COMPLETED"
          echo "======================================"