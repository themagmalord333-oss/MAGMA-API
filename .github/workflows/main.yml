name: Run FastAPI Music API with Tunnel

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-api:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Ngrok)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg curl
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Start FastAPI & Expose Public URL
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }} # Yahan apna Ngrok token secret me add karein
      run: |
        # Ngrok setup
        ngrok config add-authtoken $NGROK_TOKEN

        # Background me FastAPI server start karein
        python3 -m uvicorn app:app --host 0.0.0.0 --port 8000 &

        # Wait for FastAPI to start
        sleep 5

        # Ngrok tunnel start karein
        ngrok http 8000 --log=stdout > ngrok.log &
        sleep 5

        # Public URL Print Karein Logs me
        echo "=================================================="
        echo "YOUR PUBLIC API URL IS BELOW:"
        curl -s http://localhost:4040/api/tunnels | grep -o 'https://[^"]*' | head -n 1
        echo "=================================================="

        # Process ko alive rakhne ke liye
        tail -f ngrok.log
