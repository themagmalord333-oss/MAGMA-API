# =========================
      # PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================
      # INSTALL / CHECK SYSTEM TOOLS
      # =========================
      - name: Setup System Tools
        run: |
          set -e

          echo "======================================"
          echo "       SETTING UP SYSTEM TOOLS"
          echo "======================================"

          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg not found. Installing static FFmpeg..."

            curl -fL \
              --retry 3 \
              --connect-timeout 15 \
              --max-time 180 \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ffmpeg.tar.xz

            mkdir -p /tmp/ffmpeg-static

            tar -xJf /tmp/ffmpeg.tar.xz \
              -C /tmp/ffmpeg-static \
              --strip-components=1

            sudo cp /tmp/ffmpeg-static/ffmpeg /usr/local/bin/ffmpeg
            sudo cp /tmp/ffmpeg-static/ffprobe /usr/local/bin/ffprobe

            sudo chmod +x /usr/local/bin/ffmpeg
            sudo chmod +x /usr/local/bin/ffprobe

            rm -rf /tmp/ffmpeg-static /tmp/ffmpeg.tar.xz
          fi

          echo ""
          echo "FFmpeg:"
          command -v ffmpeg
          ffmpeg -version | head -1

          echo ""
          echo "FFprobe:"
          command -v ffprobe
          ffprobe -version | head -1

          echo ""
          echo "Node:"
          command -v node
          node --version

          echo ""
          echo "npm:"
          command -v npm
          npm --version

          echo ""
          echo "curl:"
          command -v curl

          echo ""
          echo "git:"
          command -v git
          git --version

          echo ""
          echo "======================================"
          echo "✅ SYSTEM TOOLS READY"
          echo "======================================"


      # =========================
      # INSTALL NGROK
      # =========================
      - name: Install Ngrok
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 120 \
            https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            -o ngrok.tgz

          tar -xzf ngrok.tgz

          sudo mv ngrok /usr/local/bin/ngrok

          rm -f ngrok.tgz

          ngrok version