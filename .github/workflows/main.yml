- name: Setup System Tools
  shell: bash
  run: |
    set -e

    echo "======================================"
    echo "       SETTING UP SYSTEM TOOLS"
    echo "======================================"

    echo "Checking FFmpeg..."

    if command -v ffmpeg >/dev/null 2>&1; then
      echo "✅ FFmpeg already available."
    else
      echo "FFmpeg not found."
      echo "Downloading static FFmpeg..."

      curl -fL \
        --retry 5 \
        --connect-timeout 15 \
        --max-time 180 \
        "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
        -o /tmp/ffmpeg.tar.xz

      rm -rf /tmp/ffmpeg-static
      mkdir -p /tmp/ffmpeg-static

      tar -xJf /tmp/ffmpeg.tar.xz \
        -C /tmp/ffmpeg-static \
        --strip-components=1

      sudo install -m 755 \
        /tmp/ffmpeg-static/ffmpeg \
        /usr/local/bin/ffmpeg

      sudo install -m 755 \
        /tmp/ffmpeg-static/ffprobe \
        /usr/local/bin/ffprobe

      rm -rf /tmp/ffmpeg-static
      rm -f /tmp/ffmpeg.tar.xz
    fi

    echo ""
    echo "FFmpeg:"
    command -v ffmpeg
    ffmpeg -version | head -1

    echo ""
    echo "FFprobe:"
    command -v ffprobe
    ffprobe -version | head -1

    echo ""
    echo "Node:"
    node --version

    echo ""
    echo "npm:"
    npm --version

    echo ""
    echo "curl:"
    curl --version | head -1

    echo ""
    echo "git:"
    git --version

    echo ""
    echo "======================================"
    echo "✅ SYSTEM TOOLS READY"
    echo "======================================"