name: MAGMA Music API

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - run-api

  schedule:
    # New run every 5 hours.
    # If the previous run is still running, it waits because
    # cancel-in-progress is false.
    - cron: "0 */5 * * *"

# Only one API runner at a time.
# A new run waits instead of cancelling the current one.
concurrency:
  group: magma-api-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-api:
    name: Run MAGMA API
    runs-on: ubuntu-latest

    # Stay below GitHub's hosted-runner time limit.
    timeout-minutes: 350

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ==========================================
      # SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install System Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            curl \
            wget \
            git \
            jq \
            unzip

          echo "System dependencies installed."

      # ==========================================
      # NGROK
      # ==========================================
      - name: Install Ngrok
        shell: bash
        run: |
          set -e

          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com bookworm main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list >/dev/null

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok version

      # ==========================================
      # PYTHON DEPENDENCIES
      # ==========================================
      - name: Install Python Dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          # Make sure the API runtime packages exist.
          pip install fastapi uvicorn python-dotenv

      # ==========================================
      # ENVIRONMENT
      # ==========================================
      - name: Generate Environment
        shell: bash
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          set -e

          touch .env

          if [ -n "$NGROK_TOKEN" ]; then
            echo "NGROK_TOKEN=$NGROK_TOKEN" >> .env
          fi

          echo "Environment prepared."

      # ==========================================
      # CONFIGURE NGROK
      # ==========================================
      - name: Configure Ngrok
        shell: bash
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          set -e

          if [ -z "$NGROK_TOKEN" ]; then
            echo "ERROR: NGROK_TOKEN secret is missing."
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"

          echo "Ngrok configured successfully."

      # ==========================================
      # START FASTAPI
      # ==========================================
      - name: Start FastAPI
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Starting MAGMA Music API"
          echo "======================================"

          # Your API entry point is app.py
          API_MODULE="app:app"

          echo "Using: $API_MODULE"

          nohup python -m uvicorn "$API_MODULE" \
            --host 0.0.0.0 \
            --port 8000 \
            > api.log 2>&1 &

          echo $! > api.pid

          echo "API PID: $(cat api.pid)"

          sleep 8

          if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
            echo "ERROR: FastAPI failed to start."
            echo "---------- API LOG ----------"
            cat api.log || true
            exit 1
          fi

          echo "FastAPI process is running."

      # ==========================================
      # VERIFY API
      # ==========================================
      - name: Verify API
        shell: bash
        run: |
          set -e

          echo "Checking FastAPI..."

          for i in {1..30}; do

            HTTP_CODE=$(curl -s \
              --max-time 5 \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8000/ \
              || echo "000")

            if [ "$HTTP_CODE" != "000" ]; then
              echo "FastAPI is responding. HTTP=$HTTP_CODE"
              exit 0
            fi

            echo "Waiting for FastAPI... $i/30"
            sleep 2

          done

          echo "ERROR: FastAPI did not respond."

          echo "---------- API LOG ----------"
          cat api.log || true

          exit 1

      # ==========================================
      # START NGROK
      # ==========================================
      - name: Start Ngrok
        shell: bash
        run: |
          set -e

          echo "Starting Ngrok..."

          nohup ngrok http 8000 \
            --log=stdout \
            > ngrok.log 2>&1 &

          echo $! > ngrok.pid

          sleep 8

          if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then
            echo "ERROR: Ngrok failed to start."
            echo "---------- NGROK LOG ----------"
            cat ngrok.log || true
            exit 1
          fi

          echo "Ngrok process is running."

      # ==========================================
      # GET PUBLIC URL
      # ==========================================
      - name: Get Public Ngrok URL
        shell: bash
        run: |
          set -e

          echo "Waiting for Ngrok public URL..."

          for i in {1..30}; do

            URL=$(curl -fsS \
              --max-time 5 \
              http://127.0.0.1:4040/api/tunnels \
              | jq -r '.tunnels[0].public_url // empty' \
              2>/dev/null || true)

            if [ -n "$URL" ]; then

              echo "======================================"
              echo "PUBLIC API URL"
              echo "$URL"
              echo "======================================"

              echo "API_URL=$URL" >> "$GITHUB_ENV"

              exit 0
            fi

            echo "Waiting for Ngrok... $i/30"
            sleep 2

          done

          echo "ERROR: Could not get Ngrok URL."

          echo "---------- NGROK LOG ----------"
          cat ngrok.log || true

          exit 1

      # ==========================================
      # KEEP API RUNNING
      # ==========================================
      - name: Keep API Running
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "       MAGMA MUSIC API IS ONLINE"
          echo "=========================================="
          echo "Public URL: ${API_URL:-unknown}"
          echo "=========================================="

          START_TIME=$(date +%s)

          while true; do

            # ------------------------------------
            # Check FastAPI process
            # ------------------------------------
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then

              echo "ERROR: FastAPI process stopped."

              echo "---------- API LOG ----------"
              tail -100 api.log || true

              exit 1
            fi

            # ------------------------------------
            # Check Ngrok process
            # ------------------------------------
            if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then

              echo "ERROR: Ngrok process stopped."

              echo "---------- NGROK LOG ----------"
              tail -100 ngrok.log || true

              exit 1
            fi

            # ------------------------------------
            # API health check
            # ------------------------------------
            HTTP_CODE=$(curl -s \
              --max-time 10 \
              -o /dev/null \
              -w "%{http_code}" \
              http://127.0.0.1:8000/ \
              || echo "000")

            NOW=$(date +%s)
            UPTIME=$((NOW - START_TIME))

            HOURS=$((UPTIME / 3600))
            MINUTES=$(((UPTIME % 3600) / 60))
            SECONDS=$((UPTIME % 60))

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] FastAPI=$HTTP_CODE | Ngrok=OK | Uptime=${HOURS}h ${MINUTES}m ${SECONDS}s"

            sleep 60

          done

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "Stopping background services..."

          if [ -f ngrok.pid ]; then
            kill "$(cat ngrok.pid)" 2>/dev/null || true
          fi

          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

          echo "Cleanup completed."