# =========================
      # CHECK YOUTUBE COOKIES
      # =========================
      - name: Check YouTube Cookies
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       CHECKING YOUTUBE COOKIES"
          echo "======================================"

          if [ ! -f cookies.txt ]; then
            echo "❌ cookies.txt not found in repository!"
            exit 1
          fi

          if [ ! -s cookies.txt ]; then
            echo "❌ cookies.txt is empty!"
            exit 1
          fi

          echo "✅ cookies.txt found."

          echo ""
          echo "File size:"
          wc -c cookies.txt

          echo ""
          echo "File lines:"
          wc -l cookies.txt

          echo ""
          echo "Cookie format:"

          if head -1 cookies.txt | grep -qi "netscape"; then
            echo "✅ Netscape cookie format detected."
          else
            echo "⚠️ Netscape header not detected."
          fi