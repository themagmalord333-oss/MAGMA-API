name: MAGMA YouTube Exact Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install yt-dlp
        run: |
          python -m pip install -U pip
          pip install -U yt-dlp yt-dlp-ejs

          echo "yt-dlp:"
          yt-dlp --version

          echo "Node:"
          node --version

      - name: Check cookies file
        run: |
          set -e

          echo "======================================"
          echo "COOKIE FILE CHECK"
          echo "======================================"

          if [ ! -f cookies.txt ]; then
            echo "❌ cookies.txt NOT FOUND"
            exit 1
          fi

          echo "✅ cookies.txt FOUND"
          echo "Size:"
          wc -c cookies.txt

          echo "Lines:"
          wc -l cookies.txt

          echo "Format:"
          head -1 cookies.txt

          if grep -q "Netscape HTTP Cookie File" cookies.txt; then
            echo "✅ Netscape cookie format"
          else
            echo "⚠️ Netscape header not found"
          fi

      - name: TEST 1 - No Cookies
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "TEST 1"
          echo "NO COOKIES / DEFAULT CLIENT"
          echo "======================================"

          yt-dlp \
            -v \
            --js-runtimes node \
            --remote-components ejs:github \
            --skip-download \
            --no-playlist \
            "https://www.youtube.com/watch?v=qy9NX7iI6YQ"

          echo ""
          echo "TEST 1 EXIT CODE: $?"

      - name: TEST 2 - Cookies Default
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "TEST 2"
          echo "COOKIES / DEFAULT CLIENT"
          echo "======================================"

          yt-dlp \
            -v \
            --cookies cookies.txt \
            --js-runtimes node \
            --remote-components ejs:github \
            --skip-download \
            --no-playlist \
            "https://www.youtube.com/watch?v=qy9NX7iI6YQ"

          echo ""
          echo "TEST 2 EXIT CODE: $?"

      - name: TEST 3 - Cookies + Default Web Embedded
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "TEST 3"
          echo "COOKIES + DEFAULT,WEB_EMBEDDED"
          echo "======================================"

          yt-dlp \
            -v \
            --cookies cookies.txt \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=default,web_embedded" \
            --skip-download \
            --no-playlist \
            "https://www.youtube.com/watch?v=qy9NX7iI6YQ"

          echo ""
          echo "TEST 3 EXIT CODE: $?"

      - name: TEST 4 - Cookies + App Client
        run: |
          set +e

          echo ""
          echo "======================================"
          echo "TEST 4"
          echo "COOKIES + IOS,ANDROID,WEB"
          echo "SAME AS CURRENT APP"
          echo "======================================"

          yt-dlp \
            -v \
            --cookies cookies.txt \
            --js-runtimes node \
            --remote-components ejs:github \
            --extractor-args "youtube:player_client=ios,android,web" \
            --skip-download \
            --no-playlist \
            "https://www.youtube.com/watch?v=qy9NX7iI6YQ"

          echo ""
          echo "TEST 4 EXIT CODE: $?"

      - name: FINAL RESULT
        if: always()
        run: |
          echo ""
          echo "======================================"
          echo "       DIAGNOSTIC FINISHED"
          echo "======================================"

          echo ""
          echo "Interpretation:"
          echo ""
          echo "TEST 1 fails + TEST 3 works"
          echo "=> Cookie works; YouTube default logged-in client issue."
          echo ""
          echo "TEST 3 fails + TEST 4 works"
          echo "=> Cookie works; current app client configuration is okay."
          echo ""
          echo "TEST 3 fails + TEST 4 fails"
          echo "=> Cookie/session OR GitHub runner/IP restriction needs investigation."
          echo ""
          echo "TEST 1 works"
          echo "=> GitHub runner is not currently blocked for this request."
          echo ""
          echo "TEST 4 works"
          echo "=> Current app's YouTube extraction configuration can work."
          echo ""
          echo "No cookie values are printed."