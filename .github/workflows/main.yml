name: MAGMA Music API

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - backend-url.json

permissions:
  contents: write

concurrency:
  group: magma-api-runner
  cancel-in-progress: false

jobs:
  run-api:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl git

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | \
            sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null

          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | \
            sudo tee /etc/apt/sources.list.d/ngrok.list

          sudo apt-get update
          sudo apt-get install -y ngrok

          ngrok version

      - name: Configure Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "NGROK_TOKEN secret is missing"
            exit 1
          fi

          ngrok config add-authtoken "$NGROK_TOKEN"

      - name: Start FastAPI
        run: |
          nohup uvicorn app:app \
            --host 0.0.0.0 \
            --port 8000 \
            > api.log 2>&1 &

          echo $! > api.pid

          echo "Waiting for API..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/ >/dev/null; then
              echo "API is running"
              break
            fi

            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "API crashed"

              cat api.log || true

              exit 1
            fi

            sleep 2
          done

          if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
            echo "API failed to start"
            cat api.log || true
            exit 1
          fi

      - name: Start Ngrok
        run: |
          nohup ngrok http 8000 \
            --log=stdout \
            > ngrok.log 2>&1 &

          echo $! > ngrok.pid

          echo "Waiting for Ngrok..."

          for i in {1..30}; do
            if curl -s http://127.0.0.1:4040/api/tunnels >/dev/null; then
              echo "Ngrok is running"
              break
            fi

            if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then
              echo "Ngrok crashed"

              cat ngrok.log || true

              exit 1
            fi

            sleep 2
          done

      - name: Get Ngrok URL
        run: |
          PUBLIC_URL=""

          for i in {1..30}; do

            PUBLIC_URL=$(curl -s \
              http://127.0.0.1:4040/api/tunnels \
              | python -c '
import json
import sys

try:
    data = json.load(sys.stdin)

    for tunnel in data.get("tunnels", []):
        url = tunnel.get("public_url", "")

        if url.startswith("https://"):
            print(url)
            break
except:
    pass
' || true)

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Could not get Ngrok URL"
            cat ngrok.log || true
            exit 1
          fi

          echo "$PUBLIC_URL" > current_backend_url.txt

          printf '{"url":"%s"}\n' "$PUBLIC_URL" > backend-url.json

          echo "================================"
          echo "MAGMA API URL:"
          echo "$PUBLIC_URL"
          echo "================================"

      - name: Update Backend URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp backend-url.json /tmp/backend-url.json

          git fetch origin main

          git reset --hard origin/main

          cp /tmp/backend-url.json backend-url.json

          git add backend-url.json

          if git diff --cached --quiet; then
            echo "URL unchanged"
            exit 0
          fi

          git commit -m "Update current API backend URL"

          git push origin HEAD:main

      - name: Verify Services
        run: |
          echo "Checking services..."

          if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
            echo "FastAPI is not running"
            exit 1
          fi

          if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then
            echo "Ngrok is not running"
            exit 1
          fi

          echo "FastAPI: OK"
          echo "Ngrok: OK"

          echo "Public URL:"
          cat current_backend_url.txt

      - name: Keep API Running
        run: |
          echo "================================"
          echo "MAGMA MUSIC API IS RUNNING"
          echo "================================"

          cat current_backend_url.txt

          while true; do

            # FastAPI process check
            if ! kill -0 "$(cat api.pid)" 2>/dev/null; then
              echo "FastAPI stopped"
              tail -n 200 api.log || true
              exit 1
            fi

            # FastAPI HTTP check
            if ! curl -s \
              --max-time 10 \
              http://127.0.0.1:8000/ \
              >/dev/null; then

              echo "FastAPI is not responding"
              tail -n 200 api.log || true

              exit 1
            fi

            # Ngrok process check
            if ! kill -0 "$(cat ngrok.pid)" 2>/dev/null; then
              echo "Ngrok stopped"
              tail -n 200 ngrok.log || true
              exit 1
            fi

            # Ngrok API check
            if ! curl -s \
              --max-time 10 \
              http://127.0.0.1:4040/api/tunnels \
              >/dev/null; then

              echo "Ngrok is not responding"
              tail -n 200 ngrok.log || true

              exit 1
            fi

            echo "[$(date '+%H:%M:%S')] API + Ngrok OK"

            sleep 30
          done

      - name: Show Logs On Failure
        if: failure()
        run: |
          echo "========== API LOG =========="
          cat api.log 2>/dev/null || true

          echo "========== NGROK LOG =========="
          cat ngrok.log 2>/dev/null || true