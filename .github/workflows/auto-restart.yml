name: MAGMA API Auto Restart

on:
  workflow_run:
    workflows:
      - "MAGMA Music API"
    types:
      - completed

jobs:
  restart-api:
    # Sirf MAGMA Music API ke completed run ke baad
    # next run trigger hoga.
    runs-on: ubuntu-latest

    steps:
      - name: Wait before restart
        run: sleep 20

      - name: Start next API run
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          set -e

          echo "Previous MAGMA API run completed."
          echo "Starting next MAGMA API run..."

          gh workflow run main.yml \
            --repo "${{ github.repository }}" \
            --ref main

          echo "✅ Next API run triggered."