name: Auto Restart MAGMA Music API

on:
  workflow_run:
    workflows:
      - "MAGMA Music API"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # WAIT FOR OLD RUN TO FULLY CLOSE
      # ============================================================
      - name: Wait for Previous Runner to Fully Close
        shell: bash
        run: |
          echo "Previous MAGMA API workflow completed."
          echo "Waiting 30 seconds..."
          sleep 30

      # ============================================================
      # START NEW RUN
      # ============================================================
      - name: Start Next API Run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail

          echo "Starting next MAGMA Music API run..."

          gh workflow run "main.yml" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

          echo "New MAGMA Music API run dispatched successfully."