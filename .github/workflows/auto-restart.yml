name: MAGMA API Auto Restart

on:
  workflow_run:
    workflows:
      - "MAGMA Music API"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:

  restart:

    # Only restart when the main API job
    # reaches GitHub's timeout.
    if: >
      github.event.workflow_run.name == 'MAGMA Music API' &&
      github.event.workflow_run.conclusion == 'timed_out'

    runs-on: ubuntu-latest

    steps:

      # ======================================
      # SHOW PREVIOUS RUN
      # ======================================
      - name: Show Previous Run
        run: |
          echo "======================================"
          echo "       MAGMA AUTO RESTART"
          echo "======================================"

          echo "Workflow:"
          echo "${{ github.event.workflow_run.name }}"

          echo "Conclusion:"
          echo "${{ github.event.workflow_run.conclusion }}"

          echo "Run ID:"
          echo "${{ github.event.workflow_run.id }}"


      # ======================================
      # WAIT
      # ======================================
      - name: Wait Before Restart
        run: |
          echo "Waiting 20 seconds..."
          sleep 20


      # ======================================
      # START MAIN WORKFLOW
      # ======================================
      - name: Start MAGMA Music API Again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "     STARTING MAGMA MUSIC API"
          echo "======================================"

          gh workflow run main.yml \
            --repo "${{ github.repository }}" \
            --ref main

          echo ""
          echo "======================================"
          echo "✅ NEW MAGMA API RUN STARTED"
          echo "======================================"